<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bé luyện viết tiếng Anh</title>
<style>
:root{--bg:#dff0ff;--card:#ffffff;--ink:#1f3366;--muted:#6b7a99;--sun:#ffc93c;--grass:#2fb463;--coral:#ff6b5a;--sky:#3b8cf0;--line:#c9d6ee;--paper:#fffdf5;--dot:#4f73ad;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213d;--card:#1f2f55;--ink:#eaf1ff;--muted:#9db0d6;--line:#3a4d7d;--paper:#22345c;--dot:#8fb0ee}}
:root[data-theme="dark"]{--bg:#14213d;--card:#1f2f55;--ink:#eaf1ff;--muted:#9db0d6;--line:#3a4d7d;--paper:#22345c;--dot:#8fb0ee}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{max-width:1100px;margin:0 auto;padding:14px 18px 28px}
.top{display:flex;align-items:center;gap:12px;min-height:60px}
.top h1{font-size:26px;margin:0;flex:1}
.pill{background:var(--card);border-radius:30px;padding:10px 18px;font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--line)}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{background:var(--sky);color:#fff;font-weight:800;font-size:22px;border-radius:20px;padding:14px 26px;min-height:60px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sun{background:var(--sun);color:#3a2a00}.btn.grass{background:var(--grass)}.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.chip{background:var(--card);border-radius:30px;padding:12px 22px;font-weight:800;font-size:19px;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--ink);color:var(--bg)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:14px}
.gcard{background:var(--card);border-radius:28px;padding:22px;text-align:left;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.gcard:active{transform:translateY(3px)}
.gcard b{font-size:28px}.gcard span{color:var(--muted);font-size:18px;line-height:1.35}
.gcard svg{height:70px;width:auto;align-self:flex-start}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px}
.prompt{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.prompt img,.opt img{border-radius:18px;border:3px solid var(--line);background:#fff;object-fit:contain}
.prompt img{height:150px;max-width:210px}
.vi{font-size:22px;color:var(--muted);font-weight:700}
.sound{width:64px;height:64px;border-radius:50%;background:var(--sun);font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.paper{background:var(--paper);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:6px;width:100%}
canvas{display:block;width:100%;touch-action:none}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.prog{font-weight:800;color:var(--muted);font-size:18px}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:100px}
.slot{width:74px;height:96px;border-radius:16px;background:var(--paper);border-bottom:5px solid var(--sky);display:flex;align-items:center;justify-content:center}
.slot.gap{background:none;border:0;width:30px}
.slot svg{height:84px}
.tray{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.tile{width:92px;height:104px;border-radius:20px;background:var(--card);box-shadow:0 6px 0 var(--line);display:flex;align-items:center;justify-content:center}
.tile:active{transform:translateY(3px)}
.tile svg{height:84px}
.opts{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%}
.opt{background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:center;min-width:210px;min-height:96px;flex:1 1 210px;max-width:320px}
.opt img{height:170px;max-width:100%}
.opt svg{max-width:100%;height:62px}
.opt.good{background:#c8f5d6;box-shadow:0 6px 0 var(--grass)}
.opt.bad{background:#ffd8d3}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.hero{text-align:center;padding:26px 10px}
.hero .big{font-size:84px}
.conf{position:fixed;top:-40px;font-size:34px;pointer-events:none;animation:fall 1.8s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.conf,.shake,.pop{animation:none}}
</style>
</head>

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let stars=0,group='all',ac;
try{stars=+localStorage.getItem('stars')||0}catch(e){}
const addStar=n=>{stars+=n;try{localStorage.setItem('stars',stars)}catch(e){};const p=$('#st');if(p)p.textContent='⭐ '+stars};
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const seq=ok?[[660,0],[880,.12],[1100,.24]]:[[200,0]];
  seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type=ok?'triangle':'sawtooth';g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.15)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function confetti(){const e=['⭐','🎉','🌟','✨','🎈'];for(let i=0;i<22;i++){const s=document.createElement('span');s.className='conf';s.textContent=e[i%5];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}}
const pool=()=>WORDS.filter(w=>group==='all'||w.g===group);
const topbar=(title,back)=>`<div class="top">${back?'<button class="btn ghost" id="back">◀ Về</button>':''}<h1>${title}</h1><div class="pill" id="st">⭐ ${stars}</div></div>`;
const imgTag=w=>`<img src="${IMG[w.k]}" alt="${w.w}">`;
const done=(msg,again)=>{confetti();beep(true);app.innerHTML=topbar('Giỏi quá!',1)+`<div class="hero"><div class="big">🏆</div><h2>${msg}</h2><div class="row"><button class="btn sun" id="again">Chơi lại</button><button class="btn ghost" id="home">Về trang chính</button></div></div>`;$('#back').onclick=$('#home').onclick=home;$('#again').onclick=again}

/* ---- home ---- */
function home(){
  const g=(id,t)=>`<button class="chip ${group===id?'on':''}" data-g="${id}">${t}</button>`;
  app.innerHTML=topbar('Bé luyện viết tiếng Anh',0)+
  `<div class="chips">${g('all','Tất cả')}${g('act','Hoạt động')}${g('fam','Gia đình')}</div>
  <div class="menu">
   <button class="gcard" data-game="trace">${svgWord('dance',70,'#3b8cf0')}<b>Đồ chữ</b><span>Dùng ngón tay đồ theo nét đứt để viết từ.</span></button>
   <button class="gcard" data-game="build">${svgWord('baby',70,'#ff6b5a')}<b>Xếp chữ</b><span>Chạm vào các chữ cái để ghép thành từ đúng.</span></button>
   <button class="gcard" data-game="quiz">${svgWord('family',70,'#2fb463')}<b>Hình và chữ</b><span>Nhìn hình chọn chữ, nghe âm chọn hình.</span></button>
  </div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;home()});
  document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{({trace,build,quiz})[b.dataset.game]()});
}

/* ---- game 1: trace ---- */
function trace(){
  const list=shuffle(pool());let i=0;
  const next=()=>{ if(i>=list.length)return done('Bé đã đồ xong '+list.length+' từ!',trace); one(list[i++]) };
  function one(w){
    app.innerHTML=topbar('Đồ chữ',1)+`<div class="stage"><div class="prompt">${imgTag(w)}<button class="sound" id="snd">🔊</button><div><div class="vi">${w.vi}</div><div class="prog">${i}/${list.length}</div></div></div>
    <div class="paper"><canvas id="cv"></canvas></div>
    <div class="row"><button class="btn ghost" id="clr">Xóa, đồ lại</button><button class="btn ghost" id="peek">Xem mẫu</button><button class="btn sun" id="nx" style="visibility:hidden">Tiếp ▶</button></div></div>`;
    $('#back').onclick=home;$('#snd').onclick=()=>say(w.w);setTimeout(()=>say(w.w),250);
    const cv=$('#cv'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,cw=cv.clientWidth;
    const s=Math.min(95,(cw-70)/ww(w.w)),ch=Math.round(s*2.3+70);cv.style.height=ch+'px';cv.width=cw*dpr;cv.height=ch*dpr;ctx.scale(dpr,dpr);
    const base=35+1.6*s,x0=(cw-ww(w.w)*s)/2,lw=Math.max(5,s*.1),R=Math.max(20,s*.3);
    const strokes=layout(w.w,x0,base,s).map(p=>{const pts=[];for(let k=0;k<p.length-1;k++){const[a,b]=[p[k],p[k+1]],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/5));for(let j=0;j<n;j++)pts.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n])}pts.push(p[p.length-1]);return{p,pts,hit:new Uint8Array(pts.length)}});
    const total=strokes.reduce((a,t)=>a+t.pts.length,0);let ink=[],cur=null,won=false,peek=false;
    function draw(){
      ctx.clearRect(0,0,cw,ch);ctx.lineCap='round';ctx.lineJoin='round';
      const ln=(y,c,d,wd)=>{ctx.strokeStyle=c;ctx.lineWidth=wd;ctx.setLineDash(d);ctx.beginPath();ctx.moveTo(8,y);ctx.lineTo(cw-8,y);ctx.stroke()};
      ln(base-1.6*s,css('--line'),[],1);ln(base-s,'#f08a8a',[6,6],1.2);ln(base,'#3b8cf0',[],2);ln(base+.7*s,css('--line'),[3,5],1);
      strokes.forEach(t=>{ctx.beginPath();t.p.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
        ctx.setLineDash(peek?[]:[.1,lw*2.1]);ctx.strokeStyle=peek?css('--ink'):css('--dot');ctx.lineWidth=lw;ctx.stroke()});
      ctx.setLineDash([]);ctx.fillStyle='#2fb463';
      strokes.forEach(t=>t.pts.forEach((q,k)=>{if(t.hit[k]){ctx.beginPath();ctx.arc(q[0],q[1],lw*.85,0,7);ctx.fill()}}));
      ctx.strokeStyle='rgba(255,150,40,.4)';ctx.lineWidth=5;ink.forEach(p=>{ctx.beginPath();p.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()});
    }
    const mark=(x,y)=>strokes.forEach(t=>t.pts.forEach((q,k)=>{if(!t.hit[k]&&Math.hypot(q[0]-x,q[1]-y)<R)t.hit[k]=1}));
    const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cw/r.width,(e.clientY-r.top)*ch/r.height]};
    cv.onpointerdown=e=>{if(won)return;cv.setPointerCapture(e.pointerId);const q=pos(e);cur=[q];ink.push(cur);mark(q[0],q[1]);draw()};
    cv.onpointermove=e=>{if(!cur||won)return;const q=pos(e),l=cur[cur.length-1],n=Math.ceil(Math.hypot(q[0]-l[0],q[1]-l[1])/(R/2));
      for(let j=1;j<=n;j++)mark(l[0]+(q[0]-l[0])*j/n,l[1]+(q[1]-l[1])*j/n);cur.push(q);draw()};
    cv.onpointerup=cv.onpointercancel=()=>{cur=null;const c=strokes.reduce((a,t)=>a+t.hit.reduce((x,y)=>x+y,0),0);
      if(!won&&c/total>=.88){won=true;strokes.forEach(t=>t.hit.fill(1));ink=[];draw();addStar(1);confetti();beep(true);say(w.w);$('#nx').style.visibility='visible'}};
    $('#clr').onclick=()=>{if(won)return;strokes.forEach(t=>t.hit.fill(0));ink=[];draw()};
    $('#peek').onclick=()=>{peek=true;draw();setTimeout(()=>{peek=false;draw()},1500)};
    $('#nx').onclick=next;draw();
  }
  next();
}

/* ---- game 2: build the word ---- */
function build(){
  const list=shuffle(pool());let i=0;
  const next=()=>{ if(i>=list.length)return done('Bé đã xếp xong '+list.length+' từ!',build); one(list[i++]) };
  function one(w){
    const letters=[...w.w].filter(c=>c!==' '),extra=shuffle([...'aeiosntrlmpd'].filter(c=>!letters.includes(c))).slice(0,2);
    const tiles=shuffle(letters.concat(extra)),hl=w.w.includes('th');let pos=0,mistakes=0;
    const slotsHTML=[...w.w].map(c=>c===' '?'<div class="slot gap"></div>':'<div class="slot"></div>').join('');
    app.innerHTML=topbar('Xếp chữ',1)+`<div class="stage"><div class="prompt">${imgTag(w)}<button class="sound" id="snd">🔊</button><div><div class="vi">${w.vi}</div><div class="prog">${i}/${list.length}</div></div></div>
    <div class="slots" id="sl">${slotsHTML}</div><div class="tray" id="tr">${tiles.map((c,k)=>`<button class="tile" data-k="${k}" data-c="${c}">${svgWord(c,84,css('--ink'))}</button>`).join('')}</div></div>`;
    $('#back').onclick=home;$('#snd').onclick=()=>say(w.w);setTimeout(()=>say(w.w),250);
    const slots=[...document.querySelectorAll('.slot:not(.gap)')];
    document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
      if(b.dataset.c===letters[pos]){slots[pos].innerHTML=svgWord(letters[pos],84,css('--ink'),0);slots[pos].classList.add('pop');pos++;b.style.visibility='hidden';beep(true);
        if(pos===letters.length){addStar(mistakes?0:1);confetti();say(w.w);const sl=$('#sl');sl.innerHTML=svgWord(w.w,96,'#2fb463',hl);document.querySelector('.tray').innerHTML='<button class="btn sun" id="nx">Tiếp ▶</button>';$('#nx').onclick=next}}
      else{mistakes++;beep(false);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}});
  }
  next();
}

/* ---- game 3: picture <-> word quiz ---- */
function quiz(){
  const list=shuffle(pool()).slice(0,8),all=pool();let i=0,score=0;
  const next=()=>{ if(i>=list.length)return done('Bé đúng '+score+'/'+list.length+' câu ngay lần đầu!',quiz); one(list[i++]) };
  function one(w){
    const kind=Math.random()<.5?'pic':'snd',others=shuffle(all.filter(x=>x!==w)).slice(0,2),ch=shuffle([w,...others]);let tried=false;
    const head=kind==='pic'?`<div class="prompt">${imgTag(w)}<button class="sound" id="snd">🔊</button></div><div class="vi">Chọn chữ đúng với hình</div>`
      :`<div class="prompt"><button class="sound" id="snd" style="width:110px;height:110px;font-size:52px">🔊</button></div><div class="vi">Nghe và chọn hình đúng</div>`;
    app.innerHTML=topbar('Hình và chữ',1)+`<div class="stage">${head}<div class="prog">${i}/${list.length}</div><div class="opts">${ch.map(c=>`<button class="opt" data-w="${c.w}">${kind==='pic'?svgWord(c.w,62,css('--ink'),c.w.includes('th')):imgTag(c)}</button>`).join('')}</div></div>`;
    $('#back').onclick=home;$('#snd').onclick=()=>say(w.w);setTimeout(()=>say(w.w),250);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(b.dataset.w===w.w){b.classList.add('good');beep(true);say(w.w);if(!tried){score++;addStar(1)}document.querySelectorAll('.opt').forEach(o=>o.onclick=null);setTimeout(next,1100)}
      else{tried=true;beep(false);b.classList.add('bad','shake')}});
  }
  next();
}
home();
</script>
